<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrostTiers - Rankings</title>
<link rel="icon" href="IMG_3783.jpeg">

<style>
:root{
--bg:#0a0d14;
--bar:#0e131c;
--panel:#111826;
--card:#151c2b;
--pill:#1a2334;
--line:#222c3f;
--text:#f3f5f9;
--mute:#7c879b;
--gold:#e9b83f;
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}

*{
box-sizing:border-box
}

html,body{
margin:0
}

body{
background:var(--bg);
color:var(--text);
font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
}

/* =========================
   COMPACT / ZOOMED OUT
   ========================= */

.app{
max-width:850px;
margin:0 auto;
padding:0 12px 40px;
}

button{
font-family:inherit;
color:inherit;
cursor:pointer;
}

button:focus-visible,
input:focus-visible,
a:focus-visible{
outline:2px solid #6cb8ff;
outline-offset:2px
}

/* =========================
   HEADER
   ========================= */

.hdr{
margin-top:12px;
display:flex;
align-items:center;
gap:10px;
background:var(--bar);
border:1px solid var(--line);
border-radius:18px;
padding:9px 13px;
transition:border-color .2s ease,box-shadow .2s ease;
}

.hdr:hover{
border-color:#2b3950;
box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.logo{
font:900 italic 23px/1 Impact,"Arial Black",sans-serif;
letter-spacing:1px;
background:linear-gradient(#fff 15%,#8fd3ff 55%,#3b8fd6);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:drop-shadow(0 2px 0 #10315a) drop-shadow(0 3px 0 #0a1c36);
white-space:nowrap
}

.hl{
width:36px;
height:36px;
border-radius:9px;
object-fit:cover;
transition:transform .2s ease;
}

.hl:hover{
transform:scale(1.06) rotate(-2deg);
}

.search{
flex:1;
min-width:0;
display:flex;
align-items:center;
gap:8px;
background:var(--pill);
border-radius:999px;
padding:0 13px;
height:40px;
transition:background .2s ease,box-shadow .2s ease;
}

.search:focus-within{
background:#202b3e;
box-shadow:0 0 0 2px rgba(108,184,255,.08);
}

.search input{
flex:1;
min-width:0;
background:none;
border:0;
color:var(--text);
font-size:14px;
outline:0;
}

.search svg{
width:18px;
height:18px;
flex:none;
stroke:var(--mute);
}

.burger{
background:none;
border:0;
padding:6px;
transition:transform .18s ease;
}

.burger:hover{
transform:scale(1.08);
}

.burger svg{
width:22px;
height:22px;
stroke:var(--text);
}

/* =========================
   TABS
   ========================= */

.tabs{
display:flex;
gap:7px;
overflow-x:auto;
margin-top:19px;
padding-bottom:0;
scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
display:none
}

.tab{
flex:none;
width:calc((100% - 30px)/3.4);
min-width:96px;
background:var(--bar);
border:1px solid var(--line);
border-bottom:0;
border-radius:18px 18px 0 0;
padding:9px 4px 7px;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
color:var(--mute);
font-weight:800;
font-size:14px;
position:relative;
transition:
background .18s ease,
color .18s ease,
transform .18s ease;
}

.tab:hover{
background:#131b29;
color:#cbd5e1;
transform:translateY(-1px);
}

.tab svg{
width:31px;
height:31px;
}

.tab.on{
background:var(--panel);
color:var(--text);
}

.tab.on::after{
content:"";
position:absolute;
left:6px;
right:6px;
bottom:0;
height:3px;
background:var(--text);
border-radius:2px;
box-shadow:0 0 8px rgba(255,255,255,.15);
}

/* =========================
   MAIN BOX
   ========================= */

.box{
background:var(--panel);
border:1px solid var(--line);
border-radius:0 0 21px 21px;
padding:13px 11px 13px;
}

/* =========================
   INFORMATION
   ========================= */

.info{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.ibtn{
display:flex;
align-items:center;
gap:7px;
background:var(--pill);
border:0;
border-radius:11px;
padding:0 15px;
height:38px;
font-size:14px;
font-weight:500;
transition:
background .18s ease,
transform .18s ease;
}

.ibtn:hover{
background:#222e43;
transform:translateY(-1px);
}

.ibtn i{
width:18px;
height:18px;
border-radius:50%;
background:var(--text);
color:var(--bar);
display:grid;
place-items:center;
font:800 12px Georgia,serif;
font-style:normal;
}

.srv{
display:flex;
align-items:center;
gap:8px;
}

.slogo{
width:39px;
height:39px;
border-radius:9px;
object-fit:cover;
background:linear-gradient(135deg,#6cc4ff,#2a63c9);
display:grid;
place-items:center;
}

.sl{
font-size:9px;
font-weight:800;
letter-spacing:.5px;
color:var(--mute);
}

.ip{
display:flex;
align-items:center;
gap:8px;
background:var(--pill);
border-radius:8px;
padding:0 9px;
height:30px;
font-weight:700;
font-size:13px;
border:0;
}

.ip svg{
width:17px;
height:17px;
stroke:var(--mute);
}

.dc{
width:38px;
height:30px;
border:0;
border-radius:8px;
background:#4f5cf0;
display:grid;
place-items:center;
transition:
transform .18s ease,
filter .18s ease;
}

.dc:hover{
transform:translateY(-1px) scale(1.03);
filter:brightness(1.08);
}

.dc svg{
width:21px;
height:21px;
fill:#fff;
}

/* =========================
   COLUMN HEADERS
   ========================= */

.cols{
display:grid;
grid-template-columns:67px 1fr 76px;
padding:19px 9px 9px;
color:var(--mute);
font-weight:900;
font-size:14px;
letter-spacing:.5px;
opacity:.7;
}

.cols div:nth-child(2){
padding-left:12px
}

.cols div:nth-child(3){
text-align:center
}

/* =========================
   PLAYER CARD
   ========================= */

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:17px;
padding:8px 8px 12px;
margin-bottom:10px;
transition:
transform .2s ease,
border-color .2s ease,
box-shadow .2s ease,
background .2s ease;
animation:cardIn .35s ease both;
}

.card:hover{
transform:translateY(-2px);
border-color:#2c3b52;
background:#171f30;
box-shadow:0 9px 25px rgba(0,0,0,.18);
}

.top{
display:grid;
grid-template-columns:42% 1fr auto;
align-items:center;
gap:10px;
}

.rk{
height:58px;
position:relative;
clip-path:polygon(0 0,100% 0,86% 100%,0 100%);
background:#4a5568;
overflow:hidden;
}

.rk.p1{
background:#e5b94f
}

.rk.p2{
background:#8a9aa3
}

.rk.p3{
background:#b8702e
}

.rk.px{
background:var(--pill)
}

.rk b{
position:absolute;
left:11px;
top:50%;
transform:translateY(-50%);
font:900 italic 34px/1 Inter,system-ui,sans-serif;
color:#fff;
text-shadow:2px 2px 0 rgba(0,0,0,.28);
z-index:2;
}

.rk .head{
position:absolute;
right:10%;
bottom:0;
height:100%;
image-rendering:auto;
transition:transform .2s ease;
}

.card:hover .rk .head{
transform:scale(1.04);
}

.nm{
font-weight:800;
font-size:21px;
line-height:1.1;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.tt{
display:flex;
align-items:center;
gap:6px;
color:var(--mute);
font-size:15px;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
}

.tt svg{
width:20px;
height:20px;
flex:none;
}

.tt span{
overflow:hidden;
text-overflow:ellipsis;
}

.reg{
width:48px;
height:48px;
border-radius:9px;
display:grid;
place-items:center;
font-weight:900;
font-size:18px;
transition:transform .18s ease;
}

.card:hover .reg{
transform:scale(1.04);
}

.reg.NA{
background:#4a1d26;
color:#ff5a63
}

.reg.EU{
background:#17381f;
color:#57d36a
}

.reg.AS{
background:#182a52;
color:#6fa5ff
}

.reg.OC{
background:#3a2050;
color:#d08cff
}

/* =========================
   TIERS
   ========================= */

.tl{
font-weight:900;
font-size:17px;
color:var(--mute);
margin:15px 0 7px 7px;
opacity:.85;
}

.tiers{
display:flex;
flex-wrap:wrap;
gap:3px 6px;
padding:0 3px;
}

.t{
display:flex;
flex-direction:column;
align-items:center;
width:calc((100% - 42px)/8);
min-width:35px;
}

.t .c{
width:100%;
aspect-ratio:1;
max-width:38px;
border-radius:50%;
background:#0d121b;
display:grid;
place-items:center;
border:2px solid transparent;
transition:
transform .18s ease,
border-color .18s ease,
background .18s ease;
}

.t:hover .c{
transform:scale(1.08);
background:#121a27;
}

.t .c svg{
width:60%;
height:60%;
}

.t .b{
margin-top:2px;
font-weight:900;
font-size:13px;
padding:3px 6px;
border-radius:8px;
background:#1d2434;
letter-spacing:.3px;
transition:transform .18s ease,filter .18s ease;
}

.t:hover .b{
transform:scale(1.05);
filter:brightness(1.08);
}

.t.k0 .b{
color:#e9b83f;
background:#3a3020
}

.t.k1 .b{
color:#c9b57a;
background:#2c2a26
}

.t.k2 .b{
color:#d7873a;
background:#3a2a1b
}

.t.k2 .c{
border-color:#7b4b20
}

.t.k3 .b{
color:#8f98ab;
background:#232a3a
}

.t.k4 .b{
color:#9a7b60;
background:#2b2523
}

.t.k5 .b{
color:#7c879b
}

/* =========================
   EMPTY
   ========================= */

.empty{
text-align:center;
color:var(--mute);
padding:35px 0;
}

/* =========================
   SIDE MENU
   ========================= */

.ov{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
opacity:0;
pointer-events:none;
transition:opacity .22s ease;
z-index:9;
}

.dr{
position:fixed;
top:0;
bottom:0;
right:0;
width:min(78%,420px);
background:var(--panel);
border-left:1px solid var(--line);
transform:translateX(100%);
transition:transform .25s cubic-bezier(.2,.8,.2,1);
z-index:10;
padding:calc(16px + env(safe-area-inset-top,0px)) 19px 22px;
display:flex;
flex-direction:column;
overflow-y:auto;
box-shadow:-15px 0 40px rgba(0,0,0,.25);
}

body.open .ov{
opacity:1;
pointer-events:auto
}

body.open .dr{
transform:none
}

.x{
align-self:flex-end;
width:38px;
height:38px;
border-radius:9px;
border:2px solid var(--mute);
background:none;
transition:transform .18s ease,background .18s ease;
}

.x:hover{
transform:rotate(4deg);
background:#192231;
}

.x svg{
width:20px;
height:20px;
stroke:var(--text);
}

.dr nav{
margin-top:22px;
display:flex;
flex-direction:column;
gap:9px;
}

.dr nav a{
display:flex;
align-items:center;
gap:13px;
color:var(--text);
text-decoration:none;
font-weight:800;
font-size:20px;
padding:7px 0;
transition:
color .18s ease,
transform .18s ease;
}

.dr nav a:hover{
transform:translateX(4px);
color:#9dd5ff;
}

.dr nav a.mu{
color:var(--mute);
opacity:.5
}

.dr nav svg{
width:31px;
height:31px;
flex:none;
fill:none;
stroke:currentColor;
stroke-width:1.8;
}

.dh{
margin-top:auto;
padding-top:30px;
color:var(--mute);
font-size:20px;
font-weight:500;
}

.dg{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:11px;
}

.dg a{
aspect-ratio:1;
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
display:grid;
place-items:center;
transition:
transform .18s ease,
border-color .18s ease;
}

.dg a:hover{
transform:translateY(-2px);
border-color:#34455d;
}

.dg svg{
width:50%;
height:50%;
}

/* =========================
   ANIMATIONS
   ========================= */

@keyframes cardIn{
from{
opacity:0;
transform:translateY(6px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes tabIn{
from{
opacity:0;
transform:translateY(4px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.11s}
.card:nth-child(5){animation-delay:.14s}

.tabs .tab{
animation:tabIn .25s ease both;
}

/* =========================
   MOBILE
   ========================= */

@media(min-width:600px){

.app{
max-width:850px;
}

.nm{
font-size:22px
}

.tab{
min-width:112px
}

}

/* Don't zoom too far on phones */
@media(max-width:600px){

.app{
max-width:100%;
padding-left:9px;
padding-right:9px;
}

}

@media(max-width:400px){

.nm{
font-size:19px
}

.tt{
font-size:14px
}

.rk b{
font-size:30px
}

.cols{
font-size:12px
}

.t .b{
font-size:12px
}

}

/* Accessibility */
@media(prefers-reduced-motion:reduce){

*,
*::before,
*::after{
animation-duration:.01ms !important;
animation-iteration-count:1 !important;
transition-duration:.01ms !important;
scroll-behavior:auto !important;
}

}
</style>
</head>

<svg viewBox="0 0 24 24">
<path stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M10 13l-2 2 2 2M14 13l2 2-2 2"/>
</svg>

API Docs

<div class="dh">Discords</div>

<div class="dg" id="dg"></div>

</aside>

<script>

const M=[
["Overall","overall"],
["LTMs","ltm"],
["Vanilla","vanilla"],
["UHC","uhc"],
["Pot","pot"],
["NethOP","nethop"],
["SMP","smp"],
["Sword","sword"],
["Axe","axe"],
["Mace","mace"]
];

const TI=[
"HT1",
"LT1",
"HT2",
"LT2",
"HT3",
"LT3",
"HT4",
"LT4",
"HT5",
"LT5"
];

const I=k=>`
<svg viewBox="0 0 24 24">
<use href="#i-${k}"></use>
</svg>
`;

const G=M.slice(2);

let mode="Overall";

const tabs=document.getElementById("tabs");
const list=document.getElementById("list");
const q=document.getElementById("q");

M.forEach(m=>{

const b=document.createElement("button");

b.className="tab";

b.setAttribute("role","tab");

b.innerHTML=I(m[1])+m[0];

b.onclick=()=>{

mode=m[0];

render();

};

b.dataset.m=m[0];

tabs.appendChild(b);

});

document.getElementById("dg").innerHTML=
G.map(m=>`
<a href="#" aria-label="${m[0]} Discord">
${I(m[1])}
</a>
`).join("");


/* ==========================================
   FALLBACK PLAYER DATA
   ========================================== */

const fallbackPlayers=[

{
n:"Hikerr",
r:"NA",
t:"LT3",
tiers:{
vanilla:5,
uhc:7,
pot:3,
nethop:6,
smp:7,
sword:4,
axe:5,
mace:6
}
},

{
n:"Radlus",
r:"NA",
t:"HT4",
tiers:{
vanilla:6,
uhc:7,
pot:5,
nethop:7,
smp:6,
sword:6,
axe:7,
mace:7
}
},

{
n:"Capitalizatlon",
r:"EU",
t:"LT4",
tiers:{
vanilla:7,
uhc:8,
pot:6,
nethop:8,
smp:7,
sword:7,
axe:8,
mace:8
}
}

];

let D=[...fallbackPlayers];


/* ==========================================
   RENDER
   ========================================== */

function render(){

[...tabs.children].forEach(b=>{

const on=b.dataset.m===mode;

b.classList.toggle("on",on);

b.setAttribute("aria-selected",on);

});

const f=q.value.trim().toLowerCase();

let a=D.filter(d=>
d.n.toLowerCase().includes(f)
);

const key=(M.find(m=>m[0]===mode)||[])[1];

if(mode!=="Overall"&&mode!=="LTMs"){

a=a
.filter(d=>d.tiers[key]!=null)
.sort((x,y)=>x.tiers[key]-y.tiers[key]);

}

if(mode==="LTMs"){

a=[];

}

if(!a.length){

list.innerHTML=`

<div class="empty">

${
mode==="LTMs"
?"No LTM rankings yet."
:(q.value
?"No players found."
:"No players ranked yet.")
}

</div>

`;

return;

}

list.innerHTML=a.map((d,i)=>{

const es=
(mode==="Overall")
?Object.entries(d.tiers).sort((x,y)=>x[1]-y[1])
:[[key,d.tiers[key]]];

const th=es.map(([k,v])=>`

<div class="t k${Math.min(5,Math.floor(v/2))}">

<div class="c">

${I(k)}

</div>

<div class="b">

${TI[v] || "Unranked"}

</div>

</div>

`).join("");

return `

<article class="card">

<div class="top">

<div class="rk ${i<3?'p'+(i+1):'px'}">

<b>${i+1}.</b>

<img
class="head"
src="https://mc-heads.net/avatar/${encodeURIComponent(d.n)}/128"
alt="${d.n}"
loading="lazy"
onerror="this.style.display='none'"
>

</div>

<div style="min-width:0">

<div class="nm">
${escapeHTML(d.n)}
</div>

<div class="tt">

${I("rank")}

<span>
${escapeHTML(d.t)}
</span>

</div>

</div>

<div class="reg ${d.r}">
${d.r}
</div>

</div>

<div class="tl">
TIERS
</div>

<div class="tiers">
${th}
</div>

</article>

`;

}).join("");

}


/* ==========================================
   SAFE TEXT
   ========================================== */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
   SEARCH
   ========================================== */

q.oninput=render;


/* ==========================================
   API
   ========================================== */

async function load(){

try{

const response=await fetch("/api/players");

if(!response.ok)
throw new Error("API unavailable");

const data=await response.json();

if(Array.isArray(data)&&data.length){

D=data;

}

}catch(e){

D=[...fallbackPlayers];

}

render();

}

window.loadPlayers=load;


/* ==========================================
   SIDE MENU
   ========================================== */

const b=document.body;

const op=v=>
b.classList.toggle("open",v);

function closeMenu(){

op(false);

}

document.getElementById("mb").onclick=()=>{

op(true);

};

document.getElementById("xb").onclick=()=>{

op(false);

};

document.getElementById("ov").onclick=()=>{

op(false);

};


/* ==========================================
   INFO
   ========================================== */

function showInfo(){

alert(
"FrostTiers is a Minecraft PvP tier-list project. Rankings are based on player testing and recorded results."
);

}


/* ==========================================
   START
   ========================================== */

render();

load();

</script>

</body>
</html>
