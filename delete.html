<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Delete FrostTiers Account</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background: #0b0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 25px;

      background: #151b23;
      border: 1px solid #29313d;
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      color: #aeb7c2;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;

      border: 1px solid #333d49;
      border-radius: 8px;

      background: #0d1218;
      color: white;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;

      border: 0;
      border-radius: 8px;

      background: #e53935;
      color: white;

      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Delete FrostTiers Account</h1>

    <p>
      Enter the Minecraft username and reset key for the account
      you want to permanently delete.
    </p>

    <input
      id="username"
      type="text"
      placeholder="Minecraft username"
      autocomplete="off"
    >

    <input
      id="resetKey"
      type="password"
      placeholder="Reset key"
      autocomplete="off"
    >

    <button id="deleteButton">
      Delete Account
    </button>

    <div id="result"></div>

  </div>

  <script>
    const usernameInput =
      document.getElementById("username");

    const resetKeyInput =
      document.getElementById("resetKey");

    const deleteButton =
      document.getElementById("deleteButton");

    const result =
      document.getElementById("result");


    deleteButton.addEventListener("click", async () => {

      const minecraftUsername =
        usernameInput.value.trim();

      const resetKey =
        resetKeyInput.value;

      if (!minecraftUsername || !resetKey) {
        result.textContent =
          "Enter both your Minecraft username and reset key.";
        return;
      }


      const confirmed =
        confirm(
          "Are you sure you want to permanently delete this account?"
        );

      if (!confirmed) {
        return;
      }


      deleteButton.disabled = true;
      result.textContent = "Deleting account...";


      try {

        const response = await fetch(
          "https://frosttiers.onrender.com/api/temp-delete-account",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              resetKey: resetKey,
              minecraftUsername: minecraftUsername
            })
          }
        );


        const data =
          await response.json();


        if (response.ok) {

          result.textContent =
            data.message ||
            "Account deleted successfully.";

          usernameInput.value = "";
          resetKeyInput.value = "";

        } else {

          result.textContent =
            data.error ||
            data.message ||
            "Account deletion failed.";

        }

      } catch (error) {

        result.textContent =
          "Could not connect to the FrostTiers server.";

      }


      deleteButton.disabled = false;

    });
  </script>

</body>
</html>
