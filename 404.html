<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrostTiers</title>

  <script>
    (function () {
      const path = window.location.pathname;

      // Discord route
      if (path === "/discord") {
        window.location.replace("https://discord.gg/eU54j69SX");
        return;
      }

      // GitHub Pages SPA fallback.
      // /rankings becomes /?/rankings.
      // The real index.html loads at / and then restores /rankings.
      const query =
        path === "/" ? "" : "?" + path;

      window.location.replace("/" + query);
    })();
  </script>
</head>

<body>
  <div style="
    background:#0b0d12;
    color:#e6e9f0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  ">
    Loading FrostTiers...
  </div>
</body>
</html>
